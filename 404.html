<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Available | B6 Vintage Cloth Store</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0d6a2d7.js" crossorigin="anonymous"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #000 60%, #1a1a1a 100%);
      color: #FFD700;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 6rem;
      font-weight: 700;
      text-shadow: 0 0 20px #FFD700;
      margin-bottom: 10px;
    }

    h2 {
      font-weight: 600;
      margin-bottom: 15px;
    }

    p {
      color: #ccc;
      max-width: 500px;
      margin: 0 auto 30px;
      font-size: 1rem;
    }

    .btn-gold {
      background-color: #FFD700;
      color: #000;
      border: none;
      font-weight: 600;
      border-radius: 30px;
      padding: 12px 25px;
      transition: all 0.3s ease-in-out;
      text-decoration: none;
      display: inline-block;
    }

    .btn-gold:hover {
      background-color: #e6c200;
      transform: scale(1.05);
      color: #000;
    }

    .glow-icon {
      font-size: 4rem;
      color: #FFD700;
      margin-bottom: 20px;
      text-shadow: 0 0 25px #FFD700;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 10px #FFD700; }
      to { text-shadow: 0 0 30px #FFD700; }
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: #FFD700;
      border-top: 1px solid #FFD700;
      padding-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="glow-icon"><i class="fas fa-exclamation-triangle"></i></div>
    <h1>404</h1>
    <h2>Page Not Available</h2>
    <p>Oops! The page you’re looking for seems to have wandered off our vintage rack.  
       Don’t worry — you can head back to our main collection below.</p>

    <a href="index.html" class="btn-gold"><i class="fas fa-home me-2"></i>Back to Home</a>
  </div>

  <footer>
    <p>© 2025 B6 Vintage Cloth Store | Designed by <strong>B6Innovations</strong></p>
  </footer>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
