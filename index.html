<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B6 Vintage Cloth Store</title>

  <link rel="icon" href="\img\B6logo.png" type="image/png">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

  <style>
  
    body {
      background-color: #0b0b0b;
      color: #f1c232;
      font-family: 'Poppins', sans-serif;
    }


    .navbar {
      background-color: rgba(17, 17, 17, 0.9);
      border-bottom: 2px solid #FFD700;  
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
      transition: all 0.3s ease;
    }

    .navbar-brand {
      font-weight: 700;
      color: #FFD700 !important;
      letter-spacing: 1px;
    }

    .nav-link {
      color: #FFD700 !important;
      font-weight: 500;
      transition: color 0.3s ease;
      letter-spacing: 0.5px;
    }

    .nav-link:hover {
      color: #fff !important;
    }

 
    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: linear-gradient(180deg, #000 0%, #111 100%);
      text-align: center;
      padding: 4rem 1rem;
    }

    .hero img {
      max-width: 250px;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 15px rgba(241, 194, 50, 0.3));
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      color: #FFD700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    .hero p {
      font-size: 1.2rem;
      color: #ccc;
      max-width: 600px;
      margin: 1rem auto 2rem;
    }

    .btn-gold {
      background-color: #FFD700;
      border: none;
      color: #000;
      font-weight: 600;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn-gold:hover {
      background-color: #e6c200;
      transform: scale(1.05);
    }


    footer {
      background-color: #111;
      color: #FFD700;
      padding: 2rem 0;
      font-size: 0.9rem;
      border-top: 2px solid #FFD700; 
    }

    footer a {
      color: #FFD700;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  
  <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">B6 Vintage</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon" style="filter: invert(78%) sepia(71%) saturate(415%) hue-rotate(12deg) brightness(98%) contrast(96%);"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav align-items-center">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item ms-3"><a href="#" class="nav-link"><i class="fa-solid fa-cart-shopping"></i></a></li>
          <li class="nav-item"><a href="#" class="nav-link"><i class="fa-solid fa-user"></i></a></li>
        <li class="nav-item"><a class="nav-link" href="https://forms.gle/e2sSQjE6hUvJGqMv8">Feedback</a></li>
        </ul>
      </div>
    </div>
  </nav>
 <br>
 <br>
  <section class="hero">
    <br>
    <br>
    <img src="img/B6.jpg" alt="B6 Vintage Logo" class="img-fluid">
    <h1>B6 Vintage Cloth Store</h1>
    <p>Discover timeless fashion — curated vintage apparel, shoes & accessories that redefine classic style.</p>
    <a href="shop.html" class="btn-gold">Shop Now</a>
  </section>

  <footer class="text-center">
    <div class="container">
      <p class="mb-1">© 2025 <strong>B6 Vintage Cloth Store</strong></p>
      <p class="mb-0">Designed by <a href="#" style="color:#d4af37;">B6Innovations</a></p>
    </div>
  </footer>

 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
